# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# arch-loom provisions MC on the daemon JVM. The highest node here is 1.21.11 (Java 21),
# but a newer JDK is fine — per-node compile JVMs (17/21) come from Gradle toolchains.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

# Mod identity lives in stonecutter.properties.toml (mod.*); these are only fallbacks
# for tooling that reads gradle.properties directly.
mod_id=alexsmobs
mod_name=Alex's Mobs Continued
mod_group=com.github.alexthe666
