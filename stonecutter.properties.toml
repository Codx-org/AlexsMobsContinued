# ---------------------------------------------------------------------------
# MC 26.x — the unobfuscated line. Forge nodes here build on Architectury Loom's
# NO-REMAP variant (build.forgenr.gradle.kts) because there is no SRG namespace to
# remap to, and they read accesstransformer_mojmap.cfg like the NeoForge nodes do.
# Java 25 (Context.javaVersion switches at >=26).
# ---------------------------------------------------------------------------

# 26.1, 26.1.1 and 26.1.2 are API-identical, so this one node serves all three. The manifest
# range must say so or a 26.1 client rejects the jar the store just handed it — widen HERE
# first, then tag the store to match (see declaredMcRange).
[forge."26.1.2"]
deps.minecraft = "26.1.2"
deps.minecraft-range = "[26.1, 26.1.3)"
deps.forge = "64.0.12"

[neoforge."26.1.2"]
deps.minecraft = "26.1.2"
deps.minecraft-range = "[26.1, 26.1.3)"
deps.neoforge = "26.1.2.87"

# 26.2 has no stable NeoForge yet — 26.2.0.35-beta is the newest published build.
[forge."26.2"]
deps.minecraft = "26.2"
deps.forge = "65.1.0"

[neoforge."26.2"]
deps.minecraft = "26.2"
deps.neoforge = "26.2.0.35-beta"

# ---------------------------------------------------------------------------
# Fabric. Built newest-first (26.2) and back-filled downward.
#
# deps.fabric-loader is the BUILD-TIME pin only — the loader on the compile classpath and
# in dev runs. It must NEVER be what the manifest declares: launchers install an
# MC-appropriate (older) loader, so shipping the pin as the floor makes every older node
# refuse to start. That exact bug crashed codxlib 1.3.3 / OneBlock 3.3.0.
#
# Each [fabric."<mc>"] section therefore carries its own deps.fabric-loader-min, set to
# exactly what that node's pinned fabric-api already requires — read it out of the jar
# (`unzip -p <fabric-api jar> fabric.mod.json` → depends.fabricloader) rather than guessing;
# the values are NOT monotonic across MC versions. There is deliberately no global fallback,
# so a new node that forgets the key fails loudly.
# ---------------------------------------------------------------------------

[fabric]
deps.fabric-loader = "0.19.3"

# Below 26.1 the game is obfuscated, so these nodes build on classic loom with a mappings tree
# (build.fabric.gradle.kts) and their access widener must be declared in the "named" namespace
# rather than 26.x's "official". That, and eight entries whose descriptor or package moved, is
# handled by expanding ONE predicated template per node (build-logic/AccessWidener.kt) — there is
# deliberately no per-node mod.fabric.access_widener any more; every node emits the same filename.
#
# No node carries a deps.jei pin: that key is what switches compat/jei/** into the compile, and JEI
# ships a Fabric flavour only for 1.20.1 → 1.21.1 anyway. Leaving it out drops the JEI integration
# on the whole Fabric line, matching the >=1.21.2 nodes rather than being a special case. Adding it
# back for the four eligible nodes is a separate, opt-in piece of work — the artifacts are JEI's
# FABRIC ones, not the Forge coordinates in the [forge.*] sections above.
[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.fabric-api = "0.92.11+1.20.1"
deps.fabric-loader-min = "0.16.10"

[fabric."1.20.4"]
deps.minecraft = "1.20.4"
deps.fabric-api = "0.97.3+1.20.4"
deps.fabric-loader-min = "0.15.1"

