# Alex's Mobs Continued — Stonecutter central config. Single source of truth for node deps.
#
# This tree carries the ORIGINAL Alex's Mobs Forge source forward across MC versions on
# Forge + NeoForge — and, since 2026-07-30, on Fabric as well (this repo now owns the Fabric
# line; the sibling AlexsMobsFP repo is a reference/archive).
#
# Only versions listed as nodes in settings.gradle.kts are built; the extra sections below
# are the forward map, pre-filled from codxlib's proven per-version pins.

loomx.loom_version = "1.16-SNAPSHOT"

mod.id = "alexsmobs"
mod.name = "Alex's Mobs Continued"
mod.group = "com.github.alexthe666"
mod.version = "2.1.6"
mod.description = "New, original, engaging, and aesthetic mobs for Minecraft."
mod.authors = ["Alexthe668", "Carro1001", "Paint_Ninja", "Lynk", "Codx.io"]
mod.license.name = "LGPL-3.0"
mod.license.url = "https://www.gnu.org/licenses/lgpl-3.0.html"
mod.sources_url = "https://github.com/Codx-org/Alexs-Mobs-Updated-Ported"
mod.homepage_url = "https://modrinth.com/mod/alexs-mobs-continued"
mod.issues_url = "https://github.com/Codx-org/Alexs-Mobs-Updated-Ported/issues"
mod.inception_year = "2021"

# CodxLib — the shared codx companion library, a REQUIRED separately-distributed dependency.
# Resolved per node from the local Maven repo as codx:codxlib:<ver>-<loader>+<mc>, which
# `cd ../codxlib && python3 scripts/install_maven_local.py` fills. This is the BUILD-TIME pin;
# the range each manifest declares to players is written in the five buildscripts, and it is
# deliberately a floor rather than this exact version.
deps.codxlib = "1.4.0"

# Fabric-only manifest fields (ignored by the Forge/NeoForge manifest generators).
# The access widener is Fabric's answer to the Forge access transformer; it is generated
# from META-INF/accesstransformer_mojmap.cfg and lives at the resource root.
mod.fabric.entrypoint_main = "com.github.alexthe666.alexsmobs.fabric.AlexsMobsFabric"
mod.fabric.entrypoint_client = "com.github.alexthe666.alexsmobs.fabric.AlexsMobsFabricClient"
mod.fabric.access_widener = "alexsmobs.accesswidener"
# Upstream's logo lives where the Forge manifest's logoFile points, not at Fabric's
# conventional assets/<modid>/icon.png. Pointing at it beats duplicating 300 KB per jar.
mod.fabric.icon = "assets/icon.png"

# ---------------------------------------------------------------------------
# Forge (net.minecraftforge:forge, built via Architectury Loom on Gradle 9).
# deps.forge is the build number only; "<mc>-<forge>" is assembled in the buildscript.
# Forge has NO upstream build for 1.20.5 or 1.21.2.
#
# deps.citadel — Alex's Mobs' hard dependency. Citadel only ships for 1.20.1 (Forge +
# NeoForge) and 1.21.1 (NeoForge). Above that there is nothing to depend on, so those
# nodes must bundle the required Citadel subset instead (see docs/porting-plan.md).
# ---------------------------------------------------------------------------

