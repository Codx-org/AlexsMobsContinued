# NeoForge access transformer.
#
# NeoForge dropped SRG names in 1.20.2 — its AT parser only understands Mojang official
# member names, while Forge's META-INF/accesstransformer.cfg (the file next to this one,
# which is what the Forge nodes ship) is still written in SRG (f_110901_ / m_20272_).
# This file is the same widening set translated to Mojang names; the NeoForge buildscript
# feeds it to `neoForge.accessTransformers` and processResources renames it to
# META-INF/accesstransformer.cfg in the NeoForge jar.
#
# Regenerate after editing the Forge AT: map each SRG member through the srg->named
# columns of loom's mappings-srg.tiny for the node's MC version.
#
# Five Forge entries are deliberately absent — the members no longer exist in 1.20.4+
# (ChunkRenderDispatcher$RenderChunk.needsUpdate, ChestBlockEntity's player counter,
# ChunkBiomeContainer.biomes, RenderBuffers.fixedBuffers, NoiseBasedChunkGenerator.router)
# and neither does Beardifier's 1.18-shaped constructor. None are referenced by the mod.

